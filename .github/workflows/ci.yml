name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux · GCC · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (CMake)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - name: Run test suites
        run: python tests/run_tests.py build

  windows:
    name: Windows · MSVC · tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: microsoft/setup-msbuild@v2
      - name: Build the original Visual Studio solutions
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.sln | ForEach-Object {
            Write-Host "== $($_.FullName)"
            msbuild $_.FullName /m /v:minimal /p:Configuration=Release /p:Platform=x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build (CMake, MSVC)
        run: |
          cmake -S . -B build
          cmake --build build --config Release
      - name: Run test suites
        run: python tests/run_tests.py build
